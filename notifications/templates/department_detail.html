
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ department.name }} | DNMS</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #332b28;
            background: radial-gradient(circle at top left, #eee2d5, transparent 40%), #f8f7f4;
        }
        nav {
            padding: 20px 7%;
            background: rgba(255,255,255,.65);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid white;
        }
        .logo { color: #42101c; font-size: 24px; font-weight: 800; letter-spacing: 2px; }
        .logo span { color: #7b3040; }
        main {
            max-width: 760px;
            margin: 90px auto;
            padding: 0 22px;
        }
        .card {
            padding: 40px;
            border-radius: 22px;
            background: rgba(255,255,255,.65);
            border: 1px solid white;
            box-shadow: 0 18px 45px rgba(70,35,28,.07);
        }
        .label {
            color: #7b3040;
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        h1 { color: #42101c; line-height: 1.35; }
        p { color: #716862; line-height: 1.8; }
        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 20px;
            border-radius: 9px;
            background: #5a1726;
            color: white;
            text-decoration: none;
        }
        .button:hover { background: #42101c; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">DN<span>MS</span></div>
    </nav>

    <main>
        <div class="card">
            <div class="label">Academic Department</div>
            <h1>{{ department.name }}</h1>

            <p>
                {% if department.description %}
                    {{ department.description }}
                {% else %}
                    Welcome to {{ department.name }}. Find department
                    announcements, academic updates and important
                    communications through DNMS.
                {% endif %}
            </p>

            <a class="button" href="{% url 'departments' %}">
                ← Back to Departments
            </a>
            <a class="button" href="{% url 'notifications' %}">
                View Notifications
            </a>
        </div>
    </main>
</body>
</html>
