{% extends "admin/base.html" %}

{% block title %}
    {{ title }} | DNMS Administration
{% endblock %}

{% block extrastyle %}

<style>

/* =========================================================
   DNMS ADMIN
   MATCHES THE MAIN DNMS LIQUID GLASS DESIGN
========================================================= */

:root {

    --burgundy-dark: #42121f;
    --burgundy: #5a1b2d;
    --burgundy-soft: #70283d;

    --text-dark: #302925;
    --text-soft: #716861;

    --glass: rgba(255,255,255,0.30);
    --glass-light: rgba(255,255,255,0.42);

    --glass-border: rgba(255,255,255,0.82);

}


/* =========================================================
   PAGE BACKGROUND
========================================================= */

html,
body {

    min-height: 100%;

    background:

        radial-gradient(
            circle at 8% 12%,
            rgba(222,196,159,0.28),
            transparent 30%
        ),

        radial-gradient(
            circle at 92% 18%,
            rgba(184,137,126,0.16),
            transparent 28%
        ),

        radial-gradient(
            circle at 80% 82%,
            rgba(225,204,173,0.25),
            transparent 32%
        ),

        linear-gradient(
            135deg,
            #faf9f6,
            #f3eee8,
            #faf8f4
        ) !important;

    background-attachment: fixed !important;

    color: var(--text-dark) !important;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Segoe UI",
        Inter,
        Helvetica,
        Arial,
        sans-serif !important;

}


/* =========================================================
   SOFT LIQUID LIGHT
========================================================= */

body::before {

    content: "";

    position: fixed;

    width: 520px;
    height: 520px;

    left: -160px;
    top: 80px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(255,255,255,0.75),
            rgba(222,195,157,0.20) 42%,
            transparent 72%
        );

    filter: blur(55px);

    pointer-events: none;

    z-index: -2;

}


body::after {

    content: "";

    position: fixed;

    width: 580px;
    height: 580px;

    right: -190px;
    bottom: -80px;

    border-radius: 50%;

    background:

        radial-gradient(
            circle,
            rgba(255,255,255,0.72),
            rgba(191,145,132,0.13) 42%,
            transparent 72%
        );

    filter: blur(60px);

    pointer-events: none;

    z-index: -2;

}


/* =========================================================
   DJANGO TOP HEADER
========================================================= */

#header {

    background:
        rgba(255,255,255,0.38) !important;

    backdrop-filter:
        blur(24px)
        saturate(125%) !important;

    -webkit-backdrop-filter:
        blur(24px)
        saturate(125%) !important;

    border-bottom:
        1px solid rgba(255,255,255,0.85) !important;

    box-shadow:
        0 8px 30px rgba(80,55,40,0.05) !important;

}


#branding h1 {

    color:
        var(--burgundy) !important;

    font-weight:
        850 !important;

}


#branding h1 a {

    color:
        var(--burgundy) !important;

}


#user-tools {

    color:
        var(--text-soft) !important;

}


#user-tools a {

    color:
        var(--burgundy) !important;

    font-weight:
        700 !important;

}


/* =========================================================
   MAIN AREA
========================================================= */

#content {

    background:
        transparent !important;

}


#content-main {

    background:
        transparent !important;

}


/* =========================================================
   PAGE TITLE
========================================================= */

#content h1 {

    color:
        var(--burgundy) !important;

    font-weight:
        850 !important;

    letter-spacing:
        -0.6px !important;

}


/* =========================================================
   LIQUID GLASS MODULES
========================================================= */

.module {

    position:
        relative !important;

    background:
        rgba(255,255,255,0.27) !important;

    backdrop-filter:
        blur(28px)
        saturate(125%) !important;

    -webkit-backdrop-filter:
        blur(28px)
        saturate(125%) !important;

    border:
        1px solid var(--glass-border) !important;

    border-radius:
        24px !important;

    overflow:
        hidden !important;

    box-shadow:
        0 18px 45px rgba(80,55,40,0.06),
        inset 0 1px 0 rgba(255,255,255,0.75) !important;

    margin-bottom:
        28px !important;

}


/* =========================================================
   SUBTLE GLASS REFLECTION
========================================================= */

.module::before {

    content:
        "";

    position:
        absolute;

    top:
        0;

    left:
        8%;

    width:
        84%;

    height:
        1px;

    background:
        rgba(255,255,255,0.95);

    opacity:
        0.85;

    pointer-events:
        none;

}


/* =========================================================
   SECTION HEADERS
   BURGUNDY BUT NOT GIANT
========================================================= */

.module h2,
.module caption {

    background:
        rgba(90,27,45,0.94) !important;

    color:
        #f7ead3 !important;

    font-weight:
        800 !important;

    font-size:
        14px !important;

    padding:
        15px 20px !important;

    border:
        none !important;

}


.module h2 *,
.module caption * {

    color:
        #f7ead3 !important;

}


.module h2 a,
.module h2 a:link,
.module h2 a:visited {

    color:
        #f7ead3 !important;

}


/* =========================================================
   GLASS TABLE
========================================================= */

.module table {

    background:
        transparent !important;

    border:
        none !important;

}


.module tr {

    background:
        rgba(255,255,255,0.18) !important;

    border-bottom:
        1px solid rgba(255,255,255,0.40) !important;

    transition:
        0.25s ease !important;

}


.module tr:hover {

    background:
        rgba(255,255,255,0.34) !important;

}


.module th,
.module td {

    background:
        transparent !important;

    color:
        var(--text-dark) !important;

    border:
        none !important;

}


/* =========================================================
   LINKS
========================================================= */

.module a {

    color:
        var(--burgundy) !important;

    font-weight:
        700 !important;

}


.module a:hover {

    color:
        var(--burgundy-soft) !important;

}


/* =========================================================
   ADD
========================================================= */

.addlink,
.addlink:link,
.addlink:visited {

    color:
        var(--burgundy) !important;

    font-weight:
        800 !important;

    background-image:
        none !important;

    padding-left:
        19px !important;

}


.addlink::before {

    content:
        "+" !important;

    color:
        #9b7647 !important;

    font-size:
        20px !important;

    font-weight:
        900 !important;

}


/* =========================================================
   CHANGE
========================================================= */

.changelink,
.changelink:link,
.changelink:visited {

    color:
        var(--burgundy) !important;

    font-weight:
        800 !important;

}


/* =========================================================
   RECENT ACTIONS
========================================================= */

#content-related {

    background:
        rgba(255,255,255,0.27) !important;

    backdrop-filter:
        blur(28px)
        saturate(125%) !important;

    -webkit-backdrop-filter:
        blur(28px)
        saturate(125%) !important;

    border:
        1px solid rgba(255,255,255,0.82) !important;

    border-radius:
        24px !important;

    box-shadow:
        0 18px 45px rgba(80,55,40,0.06),
        inset 0 1px 0 rgba(255,255,255,0.75) !important;

    overflow:
        hidden !important;

}


#content-related h2 {

    background:
        rgba(90,27,45,0.94) !important;

    color:
        #f7ead3 !important;

    font-weight:
        800 !important;

    padding:
        15px 20px !important;

}


#content-related h2 * {

    color:
        #f7ead3 !important;

}


#content-related .module {

    background:
        transparent !important;

    border:
        none !important;

    box-shadow:
        none !important;

    margin:
        0 !important;

}


#content-related p,
#content-related li {

    color:
        var(--text-soft) !important;

}


#content-related a {

    color:
        var(--burgundy) !important;

    font-weight:
        700 !important;

}


/* =========================================================
   BUTTONS
========================================================= */

.button,
input[type="submit"],
input[type="button"],
.submit-row input {

    background:
        var(--burgundy) !important;

    color:
        #f7ead3 !important;

    border:
        1px solid rgba(255,255,255,0.30) !important;

    border-radius:
        12px !important;

    padding:
        9px 18px !important;

    font-weight:
        800 !important;

    box-shadow:
        0 8px 20px rgba(65,18,31,0.12) !important;

}


.button:hover,
input[type="submit"]:hover,
input[type="button"]:hover {

    background:
        var(--burgundy-soft) !important;

    color:
        #fff5e3 !important;

}


/* =========================================================
   OBJECT TOOLS
========================================================= */

.object-tools a {

    background:
        var(--burgundy) !important;

    color:
        #f7ead3 !important;

    border:
        1px solid rgba(255,255,255,0.30) !important;

    border-radius:
        12px !important;

    font-weight:
        800 !important;

}


.object-tools a:hover {

    background:
        var(--burgundy-soft) !important;

}


/* =========================================================
   FORM INPUTS
========================================================= */

input,
textarea,
select {

    background:
        rgba(255,255,255,0.30) !important;

    color:
        var(--text-dark) !important;

    border:
        1px solid rgba(255,255,255,0.78) !important;

    border-radius:
        11px !important;

    backdrop-filter:
        blur(18px) !important;

    -webkit-backdrop-filter:
        blur(18px) !important;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.65) !important;

}


input:focus,
textarea:focus,
select:focus {

    border-color:
        var(--burgundy) !important;

    outline:
        none !important;

    box-shadow:
        0 0 0 3px rgba(90,27,45,0.10),
        inset 0 1px 0 rgba(255,255,255,0.85) !important;

}


/* =========================================================
   FIELDSETS
========================================================= */

fieldset {

    background:
        rgba(255,255,255,0.17) !important;

    border:
        1px solid rgba(255,255,255,0.65) !important;

    border-radius:
        20px !important;

}


fieldset h2 {

    background:
        var(--burgundy) !important;

    color:
        #f7ead3 !important;

}


/* =========================================================
   HELP / ERROR
========================================================= */

.help,
.helptext {

    color:
        #766b63 !important;

}


.errornote {

    background:
        rgba(120,45,45,0.10) !important;

    color:
        #641f32 !important;

    border:
        1px solid rgba(100,31,50,0.20) !important;

    border-radius:
        12px !important;

}


/* =========================================================
   FOOTER
========================================================= */

#footer {

    background:
        transparent !important;

    color:
        #766b63 !important;

}


/* =========================================================
   SCROLLBAR
========================================================= */

::-webkit-scrollbar {

    width:
        9px;

}


::-webkit-scrollbar-track {

    background:
        #f1ece5;

}


::-webkit-scrollbar-thumb {

    background:
        #9b6a77;

    border-radius:
        10px;

}


::-webkit-scrollbar-thumb:hover {

    background:
        #6d3045;

}


/* =========================================================
   REMOVE OLD DJANGO COLORS
========================================================= */

#header,
#header *,
.module,
.module *,
#content-related,
#content-related * {

    --header-bg:
        transparent !important;

}


/* =========================================================
   FINAL HEADER TEXT
========================================================= */

.module h2,
.module h2 *,
.module caption,
.module caption *,
#content-related h2,
#content-related h2 * {

    color:
        #f7ead3 !important;

}

</style>

{% endblock %}
