<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Profile | DNMS</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(128, 0, 32, 0.08),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(180, 150, 100, 0.15),
                    transparent 30%
                ),
                #f7f2e8;

            color: #5b1025;
        }

        nav {
            padding: 20px 8%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: 800;
            color: #6b1028;
        }

        nav a {
            text-decoration: none;
            color: #6b1028;
            font-weight: 700;
        }

        .container {
            min-height: calc(100vh - 80px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 30px 20px;
        }

        .card {
            width: 100%;
            max-width: 520px;

            padding: 40px;

            border-radius: 28px;

            background: rgba(255, 255, 255, 0.48);

            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, 0.75);

            box-shadow:
                0 20px 50px rgba(91, 16, 37, 0.12),
                inset 0 1px 0 rgba(255, 255, 255, 0.8);
        }

        h1 {
            margin-top: 0;
            text-align: center;
            color: #6b1028;
        }

        .subtitle {
            text-align: center;
            color: #765b62;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;

            font-weight: 700;
        }

        select {
            width: 100%;

            padding: 14px;

            margin-bottom: 22px;

            border-radius: 12px;

            border: 1px solid rgba(91, 16, 37, 0.2);

            background: rgba(255, 255, 255, 0.75);

            font-size: 15px;
        }

        select:focus {
            outline: none;

            border-color: #7b1835;

            box-shadow:
                0 0 0 3px rgba(123, 24, 53, 0.08);
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 12px;

            background: #6b1028;

            color: white;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;
        }

        button:hover {
            background: #4f0b1d;
        }

        .back {
            display: block;

            margin-top: 18px;

            text-align: center;

            color: #6b1028;

            font-weight: 700;

            text-decoration: none;
        }

    </style>

</head>


<body>

    <nav>

        <div class="logo">
            DNMS
        </div>

        <a href="/profile/">
            My Profile
        </a>

    </nav>


    <div class="container">

        <div class="card">

            <h1>
                Edit Profile
            </h1>

            <p class="subtitle">
                Update your department and semester
            </p>


            <form method="POST">

                {% csrf_token %}


                <label>
                    Department
                </label>

                <select name="department" required>

                    <option value="">
                        Select Department
                    </option>

                    <option
                        value="Computer Applications"
                        {% if profile.department == "Computer Applications" %}selected{% endif %}
                    >
                        Computer Applications
                    </option>

                    <option
                        value="Computer Science"
                        {% if profile.department == "Computer Science" %}selected{% endif %}
                    >
                        Computer Science
                    </option>

                    <option
                        value="Commerce"
                        {% if profile.department == "Commerce" %}selected{% endif %}
                    >
                        Commerce
                    </option>

                    <option
                        value="Electronics"
                        {% if profile.department == "Electronics" %}selected{% endif %}
                    >
                        Electronics
                    </option>

                </select>


                <label>
                    Semester
                </label>

                <select name="semester" required>

                    <option value="">
                        Select Semester
                    </option>

                    <option value="1" {% if profile.semester == "1" %}selected{% endif %}>
                        Semester 1
                    </option>

                    <option value="2" {% if profile.semester == "2" %}selected{% endif %}>
                        Semester 2
                    </option>

                    <option value="3" {% if profile.semester == "3" %}selected{% endif %}>
                        Semester 3
                    </option>

                    <option value="4" {% if profile.semester == "4" %}selected{% endif %}>
                        Semester 4
                    </option>

                    <option value="5" {% if profile.semester == "5" %}selected{% endif %}>
                        Semester 5
                    </option>

                    <option value="6" {% if profile.semester == "6" %}selected{% endif %}>
                        Semester 6
                    </option>

                    <option value="7" {% if profile.semester == "7" %}selected{% endif %}>
                        Semester 7
                    </option>

                    <option value="8" {% if profile.semester == "8" %}selected{% endif %}>
                        Semester 8
                    </option>

                </select>


                <button type="submit">
                    Save Changes
                </button>

            </form>


            <a href="/profile/" class="back">
                ← Back to Profile
            </a>

        </div>

    </div>

</body>

</html>
